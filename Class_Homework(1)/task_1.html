<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <title>Class Homework</title>

<body>
  <script>
    // 1.Create a Student class with the following:

    // Properties:
    // name (string)
    // grades (array of numbers)
    // Methods:
    // addGrade(grade) - adds a number to the grades array
    // averageGrade() - returns the average of the grades
    // printGrades() - logs each grade to the console using forEach


    class Student {
      constructor(name, grades) {
        this.name = name;
        this.grades = [];
      }

      addGrade(grade) {
        return this.grades.push(grade);
      }

      averageGrade(grades) {
        let sum = 0;
        let average = 0;

        this.grades.forEach((grade) => {
          sum += grade;
        });

        average = sum / this.grades.length;
        return average;
      }

      printGrades(grades) {
        this.grades.forEach((elem) => {
          console.log(elem);
        });
      }
    }

    const student1 = new Student("Alice");
    student1.addGrade(90);
    student1.addGrade(80);
    console.log(student1);
    student1.printGrades();
    console.log(student1.averageGrade());
  </script>
</body>

</html>

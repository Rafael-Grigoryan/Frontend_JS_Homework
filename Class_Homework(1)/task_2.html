<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 2.Create a TaskManager class.

        // Properties:
        // tasks (array of objects with title and completed)
        // Methods:
        // addTask(title) - adds a task with completed: false
        // completeTask(title) - marks a task as completed
        // getCompletedTasks() - returns an array of only completed tasks (use filter)
        // printTasks() - logs all tasks using a loop

        
        class TaskManager {
            constructor() {
                this.tasks = [];
            }

            addTask(title) {
                this.tasks.push({ title, completed: false });
            }

            completeTask(title) {
                const task = this.tasks.find(task => task.title === title);
                if (task) {
                    task.completed = true;
                } else {
                    console.log(`Task "${title}" not found.`);
                }
            }

            getCompletedTasks() {
                return this.tasks.filter(task => task.completed);
            }

            printTasks() {
                for (const task of this.tasks) {
                    const status = task.completed ? "YES" : "NO";
                    console.log(`${task.title} [${status}]`);
                }
            }
        }

        const manager = new TaskManager();
        manager.addTask("Wash dishes");
        manager.addTask("Do homework");
        manager.completeTask("Wash dishes");
        console.log(manager.getCompletedTasks());
        manager.printTasks();

    </script>
</body>

</html>

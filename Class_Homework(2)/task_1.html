<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        // 1. Book(Base Class)
        // Properties:
        // title
        // author
        // Methods:
        // describe() → logs: "Book: TITLE by AUTHOR"
        // Static:
        // count → number of Book instances created
        // getCount() → returns total book count

        class Book {
            static count = 0;

            constructor(title, author) {
                this.title = title;
                this.author = author;
                Book.count++;
            }

            describe() {
                return `Book: ${this.title.toUpperCase()} by ${this.author.toUpperCase()}`;

            }

            static getCount() {
                return Book.count;
            }
        }
        // 2. LibraryBook(extends Book)
        // Additional property:
        // libraryName
        // Constructor:
        // Accepts title, author, and libraryName
        // Uses super() to call the Book constructor
        // Override describe():
        // First call super.describe()
        // Then log: "Available at LIBRARY_NAME library."
        // 🔨 What You Must Do:
        // Create 3 different LibraryBook objects with different data.
        //             Call.describe() on each.
        // Print the total number of books created using Book.getCount().

        // example output
        // Book: The Hobbit by J.R.R.Tolkien
        // Available at Central Library library.
        // Book: 1984 by George Orwell
        // Available at City Library library.
        // Book: Dune by Frank Herbert
        // Available at Desert Library library.
        // Total books created: 3


        class LibraryBook extends Book {
            constructor(title, author, libraryName) {
                super(title, author);
                this.libraryName = libraryName;
            }

            describe() {
                super.describe();
                console.log(`Available at ${this.libraryName} library.`);
            }
        }

        const book1 = new LibraryBook("The Hobbit", "J.R.R. Tolkien", "Central Library");
        const book2 = new LibraryBook("1984", "George Orwell", "City Library");
        const book3 = new LibraryBook("Dune", "Frank Herbert", "Desert Library");

        book1.describe();
        book2.describe();
        book3.describe();

        console.log(`Total books created: ${Book.getCount()}`);

    </script>
</body>

</html>
